################################################
# DN42 BIRD 3 Configuration for slop
# AS4242420125
################################################

define OWNAS = 4242420125;
define OWNIP = 172.22.64.129;
define OWNIPv6 = fdd4:af47:dcfa::1;
define OWNNET = 172.22.64.128/27;
define OWNNETv6 = fdd4:af47:dcfa::/48;
define OWNNETSET = [172.22.64.128/27+];
define OWNNETSETv6 = [fdd4:af47:dcfa::/48+];

router id OWNIP;

protocol device {
    scan time 10;
}

# Check if an IP belongs to our own assigned prefixes
function is_self_net() -> bool {
  return net ~ OWNNETSET;
}

function is_self_net_v6() -> bool {
  return net ~ OWNNETSETv6;
}

# Verify DN42 / affiliated network address space
function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16+,       # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}

function is_valid_network_v6() -> bool {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

# ROA Tables generated from DN42 registry
roa4 table dn42_roa;
roa6 table dn42_roa_v6;

protocol static {
    roa4 { table dn42_roa; };
    include "/etc/bird/roa_dn42.conf";
};

protocol static {
    roa6 { table dn42_roa_v6; };
    include "/etc/bird/roa_dn42_v6.conf";
};

# Kernel route synchronization
protocol kernel {
    scan time 20;

    ipv6 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIPv6;
            accept;
        };
    };
};

protocol kernel {
    scan time 20;

    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };
};

# Static routes for local prefix origination
protocol static {
    route OWNNET reject;

    ipv4 {
        import all;
        export none;
    };
};

protocol static {
    route OWNNETv6 reject;

    ipv6 {
        import all;
        export none;
    };
};

# BGP Peer template for DN42
template bgp dnpeers {
    local as OWNAS;
    path metric on;

    ipv4 {
        import table on;
        import filter {
          if is_valid_network() && !is_self_net() then {
            if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            } else accept;
          } else reject;
        };

        export filter { if is_valid_network() && source ~ [RTS_STATIC, RTS_BGP] then accept; else reject; };
        import limit 9000 action block;
    };

    ipv6 {
        import table on;
        import filter {
          if is_valid_network_v6() && !is_self_net_v6() then {
            if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            } else accept;
          } else reject;
        };
        export filter { if is_valid_network_v6() && source ~ [RTS_STATIC, RTS_BGP] then accept; else reject; };
        import limit 9000 action block;
    };
};

# Dynamic peer configurations
include "/etc/bird/peers/*.conf";
